{title:"Year 5 · Launch and growth",goal:"Launch only after professional and legal requirements are satisfied; establish a sustainable operating model.",topics:["Complete qualifications, registrations, insurance and legal structure","Secure banking, tax/accounting software, portals and data safeguards","Finalize engagement letters, pricing, onboarding and review workflows","Build target-market and prospect lists, referral sources and campaigns","Conduct consultations, proposals and recurring service agreements","Track client profitability, recurring revenue and retention","Document SOPs, delegate work and assess staffing needs","Expand advisory offerings and develop the next growth plan"],deliverable:"An appropriately authorized, operational firm with an initial client base and sustainable operating model."}

["Entrepreneurship & Management","Business models, planning, strategy, revenue, costs, profitability, positioning, risk, operations and scaling."],

["Legal & Regulatory Business Knowledge","Contracts, business structures, employment fundamentals, IP, privacy, cybersecurity, insurance and compliance. Not legal advice."],
["Technology & Automation","Excel, QuickBooks, tax software, CRM, practice management, portals, e-signatures, automation, AI and backups."],
["Personal Finance & Entrepreneurial Readiness","Budgeting, emergency funds, savings, credit, debt, startup capital, cash reserves and financial risk."]

["Individual Taxation Fundamentals","Tax","Beginner","Form 1040, filing status, income, deductions, credits and tax calculation."],
["Business Entity Taxation","Tax","Intermediate","Compare sole proprietorships, partnerships, S corporations and C corporations."],
["Bookkeeping & Month-End Close","Accounting","Beginner","Build accurate books, reconciliations, adjusting entries and close procedures."],

["Tax Research Methodology","Tax","Intermediate","Find, rank, document and verify primary tax authority."],
["Small Business Financial Management","Advisory","Beginner","Cash flow, budgeting, pricing, working capital and profitability."],

["Practice Technology & Cybersecurity","Technology","Intermediate","Select systems, protect client data and design secure workflows."]
];
const SCENARIOS=[
{title:"Solo consulting business",level:"Beginner",industry:"Consulting",brief:"A single-member consulting business has service revenue, software costs, travel, a home office question and quarterly estimated tax concerns.",tasks:["Classify the entity and identify likely reporting schedules.","Organize revenue and expense records; identify substantiation gaps.","List tax research questions and authoritative sources needed.","Prepare a plain-language client information request."]},
{title:"Restaurant bookkeeping review",level:"Intermediate",industry:"Restaurant",brief:"A small restaurant has point-of-sale deposits, tips, payroll, food inventory, delivery-platform fees and inconsistent bank reconciliations.",tasks:["Reconcile POS sales to bank deposits and fees.","Identify payroll, tip reporting and sales-tax questions.","Prepare a month-end close checklist.","Draft a concise owner-facing issues report."]},
{title:"S corporation owner planning",level:"Advanced",industry:"Professional services",brief:"An S corporation owner asks about reasonable compensation, distributions, basis, retirement contributions and estimated taxes.",tasks:["List missing facts before making recommendations.","Identify basis and reasonable-compensation research areas.","Separate tax compliance from planning assumptions.","Prepare a research memo outline and client questions."]},
{title:"Rental property investor",level:"Intermediate",industry:"Real estate",brief:"An individual owns two rental properties, has repairs and improvements, mortgage interest, depreciation records and a property sale question.",tasks:["Organize property-level income and expenses.","Distinguish repair-versus-improvement research issues.","Identify depreciation and passive activity questions.","Prepare a records request and issue summary."]}
];
const SOP_DEFAULT=["Client acceptance and conflict check","Engagement letter and scope confirmation","Secure document request and receipt tracking","Preparation workflow and source-document tie-out","Independent review and issue resolution","Client approval and authorized filing","Invoice, payment and collections follow-up","Retention, access removal and secure disposal"];
const initial={
profile:{name:"",launchDate:"2031-11-06",weeklyHours:7,wake:"05:30",bed:"22:00",workStart:"08:00",workEnd:"17:00",workout:"05:45–06:45",commute:30,credential:"Exploring CPA / EA",businessFocus:"Individual and small-business tax, bookkeeping and advisory",launchSavingsGoal:25000},
tasks:[{id:1,title:"Study individual taxation",day:"Tuesday",start:"19:00",duration:90,category:"Tax",done:false},{id:2,title:"CPA / EA requirements research",day:"Thursday",start:"19:00",duration:60,category:"Credentials",done:false},{id:3,title:"Practical accounting exercise",day:"Saturday",start:"10:00",duration:120,category:"Accounting",done:false},{id:4,title:"Weekly review and planning",day:"Sunday",start:"17:00",duration:45,category:"Planning",done:false}],
courses:DEFAULT_COURSES.map((c,i)=>({id:i+1,title:c[0],area:c[1],level:c[2],description:c[3],status:"Not started",confidence:2,notes:"",lessons:[],review:""})),
research:[],scenarios:SCENARIOS.map((s,i)=>({...s,id:i+1,notes:"",status:"Not started"})),credentials:[{name:"CPA eligibility evaluation",status:"Not started",notes:"Confirm education, exam and experience requirements with Michigan's current licensing authority."},{name:"CPA examination",status:"Not started",notes:"Track jurisdiction application, sections, scores and retakes."},{name:"CPA experience and licensure",status:"Not started",notes:"Confirm qualifying experience and supervisor requirements."},{name:"Enrolled Agent (EA)",status:"Exploring",notes:"Review current IRS Special Enrollment Examination and enrollment requirements."},{name:"PTIN / e-file authorization",status:"Not started",notes:"Research requirements applicable to intended tax preparation activities."}],
sops:SOP_DEFAULT.map((x,i)=>({title:x,done:false,notes:""})),
expenses:[{name:"Professional licensing and exams",amount:1200,frequency:"Annual"},{name:"Tax and accounting software",amount:300,frequency:"Monthly"},{name:"Professional liability insurance",amount:1500,frequency:"Annual"},{name:"Marketing and website",amount:150,frequency:"Monthly"},{name:"Continuing education and memberships",amount:1000,frequency:"Annual"}],
assumptions:{individuals:60,individualFee:250,businesses:20,businessFee:900,bookkeeping:10,bookkeepingFee:350,advisory:5,advisoryFee:600,otherCosts:12000,ownerPay:45000},
savings:[],goals:[{title:"Build foundational tax knowledge portfolio",year:1,status:"Not started"},{title:"Complete business tax practice portfolio",year:2,status:"Not started"},{title:"Build three advisory case studies",year:3,status:"Not started"},{title:"Complete firm business plan and operating procedures",year:4,status:"Not started"},{title:"Pass launch-readiness review",year:5,status:"Not started"}],
reviews:[],settings:{}
};
let data=load(), page="dashboard", searchTerm="";
function load(){try{let x=JSON.parse(localStorage.getItem("firmpath_v1"));return x?merge(initial,x):structuredClone(initial)}catch(e){return structuredClone(initial)}}
function merge(base,other){let out=structuredClone(base);for(let k in other)out[k]=other[k];return out}
function save(){localStorage.setItem("firmpath_v1",JSON.stringify(data));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)||0)}
function pct(n,d){return d?Math.round(n/d*100):0}
function today(){return new Date().toISOString().slice(0,10)}
function setPage(p){page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("crumb").textContent=({dashboard:"Dashboard",schedule:"My Schedule",roadmap:"Five-Year Roadmap",learning:"Learning Center",research:"Tax Research Library",scenarios:"Practice Client Scenarios",credentials:"CPA / EA Tracker",business:"Business Education",operations:"Firm Operations",finance:"Financial Planning",launch:"Firm Launch Planner",reports:"Progress Reports",settings:"Settings & Backup"})[p];document.getElementById("sidebar").classList.remove("open");render()}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)setPage(b.dataset.page)});
function toggleMenu(){document.getElementById("sidebar").classList.toggle("open")}
function head(kicker,title,desc,actions=""){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="sub">${desc}</div></div><div class="row">${actions}</div></div>`}
function card(title,body,extra=""){return `<section class="card ${extra}"><h3>${title}</h3>${body}</section>`}
function bar(label,value){return `<div class="barline"><span>${esc(label)}</span><div class="progress"><span style="width:${Math.min(100,value)}%"></span></div><b>${value}%</b></div>`}
function render(){save();document.getElementById("todayLabel").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});let v=document.getElementById("view");v.innerHTML=({dashboard:dashboard,schedule:schedule,roadmap:roadmap,learning:learning,research:research,scenarios:scenarios,credentials:credentials,business:business,operations:operations,finance:finance,launch:launch,reports:reports,settings:settings})[page]();wireForms()}
function dashboard(){
let done=data.tasks.filter(t=>t.done).length, hours=data.tasks.filter(t=>t.done).reduce((a,t)=>a+(+t.duration||0),0)/60;
let coursePct=pct(data.courses.filter(c=>c.status==="Completed").length,data.courses.length);
let goalPct=pct(data.goals.filter(g=>g.status==="Completed").length,data.goals.length);
let readiness=readinessScores();
return head("Your long-term plan","Build the firm before you build the firm.","A practical five-year development system. Focus on consistent weekly progress, demonstrated skills and responsible launch preparation.")+
`<div class="grid g4">
${card("Weekly study target",`<div class="metric">${data.profile.weeklyHours} hrs</div><div class="tiny">Your current weekly development goal</div>`)}
${card("Tasks completed",`<div class="metric">${done}/${data.tasks.length}</div><div class="tiny">Across your current weekly plan</div>`)}
${card("Learning progress",`<div class="metric">${coursePct}%</div><div class="progress"><span style="width:${coursePct}%"></span></div><div class="tiny">Courses marked complete</div>`)}
${card("Launch savings goal",`<div class="metric">${money(totalSavings())}</div><div class="tiny">Target: ${money(data.profile.launchSavingsGoal)}</div>`)}
</div>
<div class="grid g2" style="margin-top:16px">
${card("Your five-year roadmap",`<div class="stack">${YEARS.map((y,i)=>`<div><div class="row between"><b style="font-size:13px">${y.title}</b><span class="tag">${data.goals.filter(g=>g.year===i+1&&g.status==="Completed").length}/${data.goals.filter(g=>g.year===i+1).length||1} goals</span></div><div class="tiny">${y.goal}</div></div>`).join("")}</div><div style="margin-top:12px"><button class="btn small" onclick="setPage('roadmap')">Open roadmap →</button></div>`)}
${card("Competency snapshot",`${readiness.map(x=>bar(x[0],x[1])).join("")}<div class="notice warn">Completion is not proof of competence. Add evidence from assessments, projects and supervised work before marking a skill demonstrated.</div>`)}
</div>
<div class="grid g2" style="margin-top:16px">
${card("This week's plan",`${data.tasks.slice(0,5).map(t=>`<div class="listitem"><div class="checkrow"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${t.id})"><label><b>${esc(t.title)}</b><div class="tiny">${esc(t.day)} · ${esc(t.start)} · ${t.duration} min</div></label></div></div>`).join("")}<button class="btn small" style="margin-top:10px" onclick="setPage('schedule')">Manage schedule →</button>`)}
${card("Next best actions",`<div class="listitem"><b>1. Verify your professional pathway</b><div class="tiny">Confirm current Michigan CPA eligibility, exam and experience requirements through official sources.</div></div><div class="listitem"><b>2. Build tax research habits</b><div class="tiny">Document the issue, authority hierarchy, tax year, conclusion and verification date.</div></div><div class="listitem"><b>3. Practice client communication</b><div class="tiny">Turn technical conclusions into clear, qualified client-facing explanations.</div></div><button class="btn small" onclick="setPage('credentials')">Review credentials →</button>`)}
</div><div class="footer-note">This dashboard is a planning and education tool, not a substitute for professional supervision, current legal research or licensing advice.</div>`

function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;render()}function deleteTask(id){data.tasks=data.tasks.filter(x=>x.id!==id);render()}
function profileField(k,v){data.profile[k]=["weeklyHours","commute","launchSavingsGoal"].includes(k)?+v:v;save()}
function updateGoal(title,status){let g=data.goals.find(x=>x.title===title);if(g)g.status=status;save()}
function addGoal(year){openModal("Add roadmap milestone",`<div class="field"><label>Milestone</label><input id="gTitle"></div><div class="field"><label>Year</label><input id="gYear" type="number" value="${year}" min="1" max="5"></div>`,`Add`,()=>{if(val("gTitle").trim())data.goals.push({title:val("gTitle"),year:+val("gYear"),status:"Not started"})})}
function addCourse(){openModal("Add learning course",`<div class="field"><label>Course title</label><input id="cTitle"></div><div class="field"><label>Area</label><input id="cArea" value="Business"></div><div class="field"><label>Difficulty</label><select id="cLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Description and objectives</label><textarea id="cDesc"></textarea></div>`,`Add course`,()=>{if(val("cTitle").trim())data.courses.push({id:Date.now(),title:val("cTitle"),area:val("cArea"),level:val("cLevel"),description:val("cDesc"),status:"Not started",confidence:1,notes:"",lessons:[],review:""})})}
function courseField(id,k,v){let c=data.courses.find(x=>x.id===id);if(c)c[k]=k==="confidence"?+v:v;save()}
function editCourse(id){let c=data.courses.find(x=>x.id===id);openModal("Edit course",`<div class="field"><label>Course title</label><input id="cTitle" value="${esc(c.title)}"></div><div class="field"><label>Learning objectives, prerequisites, resources and lesson outline</label><textarea id="cDesc">${esc(c.description)}</textarea></div>`,`Save`,()=>{c.title=val("cTitle");c.description=val("cDesc")})}
function deleteCourse(id){if(confirm("Delete this course?")){data.courses=data.courses.filter(x=>x.id!==id);render()}}
function addResearch(){openModal("New tax research entry",researchForm(), "Save entry",()=>{data.research.push(readResearch(Date.now()))})}
function researchForm(r={}){return `<div class="grid g2"><div class="field"><label>Subject</label><input id="rSubject" value="${esc(r.subject||"")}"></div><div class="field"><label>Tax year</label><input id="rYear" value="${esc(r.year||"")}"></div><div class="field"><label>Taxpayer / entity type</label><input id="rTaxpayer" value="${esc(r.taxpayer||"")}"></div><div class="field"><label>Authority and references</label><input id="rAuthority" value="${esc(r.authority||"")}"></div><div class="field"><label>Official source link</label><input id="rLink" value="${esc(r.link||"")}"></div><div class="field"><label>Last verified</label><input id="rVerified" type="date" value="${esc(r.verified||"")}"></div></div><div class="field"><label>Explanation, example, exceptions and conclusion</label><textarea id="rNotes">${esc(r.notes||"")}</textarea></div>`}
function readResearch(id){return{id,subject:val("rSubject"),year:val("rYear"),taxpayer:val("rTaxpayer"),authority:val("rAuthority"),link:val("rLink"),verified:val("rVerified"),notes:val("rNotes")}}
function editResearch(id){let r=data.research.find(x=>x.id===id);openModal("Edit research entry",researchForm(r),"Save",()=>Object.assign(r,readResearch(id)))}
function deleteResearch(id){if(confirm("Delete this research entry?")){data.research=data.research.filter(x=>x.id!==id);render()}}
function addScenario(){openModal("Create fictional scenario",`<div class="field"><label>Scenario title</label><input id="sTitle"></div><div class="grid g2"><div class="field"><label>Industry</label><input id="sIndustry"></div><div class="field"><label>Difficulty</label><select id="sLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div><div class="field"><label>Client background</label><textarea id="sBrief"></textarea></div><div class="field"><label>Assignments (one per line)</label><textarea id="sTasks"></textarea></div>`,`Create`,()=>{data.scenarios.push({id:Date.now(),title:val("sTitle"),industry:val("sIndustry"),level:val("sLevel"),brief:val("sBrief"),tasks:val("sTasks").split("\\n").filter(Boolean),notes:"",status:"Not started"})})}
function scenarioField(id,k,v){let s=data.scenarios.find(x=>x.id===id);if(s)s[k]=v;save()}
function editScenario(id){let s=data.scenarios.find(x=>x.id===id);openModal("Edit scenario",`<div class="field"><label>Title</label><input id="sTitle" value="${esc(s.title)}"></div><div class="field"><label>Background</label><textarea id="sBrief">${esc(s.brief)}</textarea></div><div class="field"><label>Assignments</label><textarea id="sTasks">${esc(s.tasks.join("\n"))}</textarea></div>`,`Save`,()=>{s.title=val("sTitle");s.brief=val("sBrief");s.tasks=val("sTasks").split("\n").filter(Boolean)})}
function credentialField(i,k,v){data.credentials[i][k]=v;save()}
function saveTrack(i){data.settings["track"+i]=val("track"+i);save();alert("Learning action saved.")}
function sopField(i,k,v){data.sops[i][k]=v;save()}
function addSop(){openModal("Add firm procedure",`<div class="field"><label>Procedure name</label><input id="sopTitle"></div>`,`Add`,()=>{if(val("sopTitle"))data.sops.push({title:val("sopTitle"),done:false,notes:""})})}
function assumption(k,v){data.assumptions[k]=+v||0;render()}
function expenseField(i,k,v){data.expenses[i][k]=k==="amount"?+v:v;save()}
function addExpense(){openModal("Add expense",`<div class="field"><label>Expense name</label><input id="eName"></div><div class="field"><label>Amount</label><input id="eAmount" type="number"></div><div class="field"><label>Frequency</label><select id="eFreq"><option>Annual</option><option>Monthly</option></select></div>`,`Add`,()=>data.expenses.push({name:val("eName"),amount:+val("eAmount")||0,frequency:val("eFreq")}))}
function deleteExpense(i){data.expenses.splice(i,1);render()}
function addSaving(){let amount=+val("saveAmount");if(amount>0){data.savings.push({amount,date:val("saveDate")||today()});render()}}
function deleteSaving(i){data.savings.splice(i,1);render()}
function setting(k,v){data.settings[k]=v;save()}
function saveReview(){let keys=["r1","r2","r3","r4","r5"];let vals=keys.map(val);if(!vals.some(Boolean)){alert("Add at least one reflection before saving.");return}data.reviews.push({id:String(Date.now()),date:today(),accomplished:vals[0],missed:vals[1],learned:vals[2],attention:vals[3],priorities:vals[4]});render()}
function deleteReview(id){data.reviews=data.reviews.filter(x=>x.id!==id);render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="firmpath-backup-"+today()+".json";a.click();URL.revokeObjectURL(url)}
function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!parsed.profile||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.courses))throw Error("This does not look like a FirmPath backup.");data=merge(initial,parsed);save();alert("Backup imported.");render()}catch(err){alert("Could not import backup: "+err.message)}};reader.readAsText(f)}
function resetData(){if(confirm("This permanently clears FirmPath data stored in this browser. Export a backup first. Continue?")){localStorage.removeItem("firmpath_v1");data=structuredClone(initial);render()}}
render();
</script>
</body>
</html>
